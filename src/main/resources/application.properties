server.port=${PORT:8080}
logging.level.org.atmosphere=warn
server.forward-headers-strategy=framework

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,consulting.segieth,de.witchcafe

# Let Hibernate update the schema automatically or create it if it does not exist.
spring.datasource.url=jdbc:h2:file:./data/mydb
spring.jpa.hibernate.ddl-auto=update

spring.main.allow-bean-definition-overriding=true

# Erster Login mit dieser Email wird automatisch Admin
witch-auth.first-admin-email=frank.segieth@gmail.com

# Login-Seite von witch-auth (/login)
witch-auth.app-name=VFS
# Emoji als Unicode-Escape: Spring liest .properties als ISO-8859-1, direkt eingetragen wird es zu Zeichensalat
witch-auth.app-icon=\uD83D\uDDC2

# ============================================================
# OAuth2 — Client-IDs/Secrets stehen NICHT hier, sondern lokal in
# config/application.properties (von Git ignoriert, Vorlage:
# config/application.properties.example). Nur dort aktivierte
# Provider erscheinen auf der Login-Seite.
# Hier nur die (nicht geheimen) Endpunkte der Nicht-Standard-Provider.
# ============================================================

# ── GitLab ──────────────────────────────────────────────
spring.security.oauth2.client.provider.gitlab.authorization-uri=https://gitlab.com/oauth/authorize
spring.security.oauth2.client.provider.gitlab.token-uri=https://gitlab.com/oauth/token
spring.security.oauth2.client.provider.gitlab.user-info-uri=https://gitlab.com/oauth/userinfo
spring.security.oauth2.client.provider.gitlab.jwk-set-uri=https://gitlab.com/oauth/discovery/keys
spring.security.oauth2.client.provider.gitlab.user-name-attribute=sub

# ── Mastodon (mastodon.social) ──────────────────────────
spring.security.oauth2.client.provider.mastodon.authorization-uri=https://mastodon.social/oauth/authorize
spring.security.oauth2.client.provider.mastodon.token-uri=https://mastodon.social/oauth/token
spring.security.oauth2.client.provider.mastodon.user-info-uri=https://mastodon.social/api/v1/accounts/verify_credentials
spring.security.oauth2.client.provider.mastodon.user-name-attribute=id
