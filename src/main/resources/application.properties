server.port=${PORT:8080}
logging.level.org.atmosphere=warn
server.forward-headers-strategy=framework

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,consulting.segieth,de.witchcafe

# Let Hibernate update the schema automatically or create it if it does not exist.
spring.datasource.url=jdbc:h2:file:./data/mydb
spring.jpa.hibernate.ddl-auto=update

spring.main.allow-bean-definition-overriding=true

# Erster Login mit dieser Email wird automatisch Admin
witch-auth.first-admin-email=frank.segieth@gmail.com

# ============================================================
# OAuth2 Credentials — werden aus Umgebungsvariablen gelesen
# ============================================================

# ── Google ───────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${VFS_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${VFS_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ── GitHub ──────────────────────────────────────────────
spring.security.oauth2.client.registration.github.client-id=${VFS_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${VFS_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

